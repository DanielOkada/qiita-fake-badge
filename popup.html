<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Qiita Fake Badge</title>
  <style>
    body { width: 260px; margin: 0; padding: 14px; font: 14px/1.5 system-ui, sans-serif; color: #1e2121; }
    h1 { margin: 0 0 10px; font-size: 15px; }
    .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
    input[type="number"] { width: 64px; padding: 3px 6px; }
    button { padding: 5px 10px; cursor: pointer; }
    #status { margin: 10px 0 0; font-weight: 600; }
    .note { margin: 10px 0 0; font-size: 12px; color: #656a6a; }
  </style>
</head>
<body>
  <h1>Qiita 赤丸</h1>
  <label class="row"><input type="checkbox" id="enabled"> 有効にする</label>
  <div class="row">
    <input type="number" id="count" min="1" max="999" value="3">
    <span>件</span>
    <button id="set">赤丸を出す</button>
    <button id="clear">消す</button>
  </div>
  <p id="status"></p>
  <p class="note">設定したあと、Qiitaのページを再読み込みすると反映されます。通知一覧を開くと、赤丸は消えます。この拡張機能は外部に通信しません。</p>
  <script src="popup.js"></script>
</body>
</html>
